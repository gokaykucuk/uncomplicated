# Tag vX.Y.Z to publish: static binaries on the GitHub release and a multi-arch image on GHCR.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, arch: amd64, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04, arch: arm64, zig: true }
          - { target: aarch64-apple-darwin, os: macos-15, zig: false }
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install; rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        run: |
          if ${{ matrix.zig }}; then build=zigbuild; else build=build; fi
          cargo $build --release --locked -p uc-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          bin=target/${{ matrix.target }}/release/unc
          ./"$bin" --version || true
          tar -czf dist/unc-${{ matrix.target }}.tar.gz -C "$(dirname "$bin")" unc
          if [ -n "${{ matrix.arch }}" ]; then mkdir -p image/${{ matrix.arch }} && cp "$bin" image/${{ matrix.arch }}/unc; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
      - if: matrix.arch
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: image/

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum unc-*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes unc-*.tar.gz SHA256SUMS

  image:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: dist/image
          merge-multiple: true
      - run: chmod +x dist/image/*/unc
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
