[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
uc-core = { path = "crates/uc-core" }
uc-js = { path = "crates/uc-js" }
uc-go = { path = "crates/uc-go" }
uc-engine = { path = "crates/uc-engine" }

oxc_allocator = "0.154.0"
oxc_ast = "0.154.0"
oxc_ast_visit = "0.154.0"
oxc_cfg = "0.154.0"
oxc_ecmascript = "0.154.0"
oxc_parser = "0.154.0"
oxc_regular_expression = "0.154.0"
oxc_semantic = "0.154.0"
oxc_span = "0.154.0"
oxc_syntax = "0.154.0"
tree-sitter = "0.27.1"
tree-sitter-go = "0.25.0"

clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
memchr = "2"
mimalloc = { version = "0.1", default-features = false }
rayon = "1.12"
regex = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
bitcode = { version = "0.6", features = ["serde"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
debug = 1
[profile.dev.package."*"]
opt-level = 2
